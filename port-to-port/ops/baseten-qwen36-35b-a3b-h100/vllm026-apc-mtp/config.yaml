# yaml-language-server: $schema=https://raw.githubusercontent.com/basetenlabs/truss/main/truss/config.schema.json

model_name: qwen3-6-35b-a3b-fp8-h100-vllm026-apc-mtp

model_metadata:
  example_model_input:
    model: Qwen/Qwen3.6-35B-A3B-FP8
    messages:
      - role: user
        content: "Say hello in one sentence."
    stream: true
    max_tokens: 128
    temperature: 0.7
    top_p: 0.95
  tags:
    - openai-compatible
    - qwen3.6
    - moe
    - fp8
    - benchmark
    - prefix-caching
    - mtp

base_image:
  image: vllm/vllm-openai:v0.26.0

weights:
  - source: "hf://Qwen/Qwen3.6-35B-A3B-FP8@95a723d08a9490559dae23d0cff1d9466213d989"
    mount_location: /models/qwen3.6-35b-a3b-fp8

resources:
  accelerator: H100
  use_gpu: true

runtime:
  predict_concurrency: 1
  streaming_read_timeout: 120
  health_checks:
    startup_threshold_seconds: 1200
    restart_threshold_seconds: 300
    stop_traffic_threshold_seconds: 120

environment_variables:
  HF_HUB_ENABLE_HF_TRANSFER: "1"
  VLLM_LOGGING_LEVEL: INFO

docker_server:
  start_command: >-
    vllm serve /models/qwen3.6-35b-a3b-fp8
    --served-model-name Qwen/Qwen3.6-35B-A3B-FP8
    --host 0.0.0.0
    --port 8000
    --trust-remote-code
    --dtype bfloat16
    --tensor-parallel-size 1
    --max-model-len 65536
    --max-num-seqs 1
    --gpu-memory-utilization 0.90
    --generation-config vllm
    --enable-chunked-prefill
    --language-model-only
    --reasoning-parser qwen3
    --enable-auto-tool-choice
    --tool-call-parser qwen3_coder
    --enable-prefix-caching
    --mamba-cache-mode align
    --speculative_config.method mtp
    --speculative_config.num_speculative_tokens 2
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/chat/completions
  server_port: 8000
